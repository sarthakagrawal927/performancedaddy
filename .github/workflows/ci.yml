name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: swift build -c release
      - run: python3 -m unittest test_sparkle_support
        working-directory: scripts
      - run: node --test worker.test.mjs
        working-directory: site
